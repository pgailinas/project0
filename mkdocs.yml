site_name: Project0
site_description: >-
  A documentation-first AI software development platform for building,
  validating, and maintaining AI-assisted software systems.

site_url: https://pgailinas.github.io/project0/

repo_name: pgailinas/project0
repo_url: https://github.com/pgailinas/project0
edit_uri: edit/main/docs/

theme:
  name: material

  font:
    text: Merriweather Sans
    code: Red Hat Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.action.edit

  palette:
    # Dark mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Light mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/project0-colors.css

nav:
  - Welcome to Project0: index.md

  - Project0 Platform:
      - Overview: platform/index.md
      - Project Charter: platform/Project_Charter.md
      - Project Directory Structure: platform/Project_Directory_Structure.md
      - Development Environment: platform/Development_Environment.md
      - Development Standards: platform/Development_Standards.md
      - Documentation Standards: platform/Documentation_Standards.md
      - Testing Guide: platform/Testing_Guide.md
      - Implementation Roadmap: platform/Implementation_Roadmap.md
      - Implementation Status: platform/Implementation_Status.md
      - Dashboard Design: platform/Dashboard_Design.md
      - Component Communication Design: platform/Component_Communication_Design.md
      - Shared Data Models and Error Contracts: platform/Shared_Data_Models_and_Error_Contracts.md
      - Agent Skills Design: platform/Agent_Skills_Design.md
      - Project0 Validation Status: platform/Project0_Validation_Status.md

  - Documentation Agent:
      - Overview: documentation-agent/index.md
      - Documentation Agent Charter: documentation-agent/Documentation_Agent_Charter.md
      - Documentation Agent Functional Spec: documentation-agent/Documentation_Agent_Functional_Spec.md
      - Documentation Agent Architecture: documentation-agent/Documentation_Agent_Architecture.md
      - Documentation Agent Design: documentation-agent/Documentation_Agent_Design.md
      - Documentation Agent Interface Design: documentation-agent/Documentation_Agent_Interface_Design.md
      - Documentation Agent Testing Guide: documentation-agent/Documentation_Agent_Testing_Guide.md
      - Documentation Agent Test Plan: documentation-agent/Documentation_Agent_Test_Plan.md
      - Documentation Agent Test Results: documentation-agent/Documentation_Agent_Test_Results.md

  - Research Agent:
      - Overview: research-agent/index.md
      - Research Agent Charter: research-agent/Research_Agent_Charter.md
      - Research Agent Functional Spec: research-agent/Research_Agent_Functional_Spec.md
      - Research Agent Architecture: research-agent/Research_Agent_Architecture.md
      - Research Agent Design: research-agent/Research_Agent_Design.md
      - Research Agent Interface Design: research-agent/Research_Agent_Interface_Design.md
      - Research Agent Testing Guide: research-agent/Research_Agent_Testing_Guide.md
      - Research Agent Test Plan: research-agent/Research_Agent_Test_Plan.md
      - Research Agent Test Results: research-agent/Research_Agent_Test_Results.md

markdown_extensions:
  - attr_list
  - admonition

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  
