site_name: Project0
site_description: >-
  A documentation-first AI software development platform for building,
  validating, and maintaining AI-assisted software systems.

site_url: https://pgailinas.github.io/project0/

repo_name: pgailinas/project0
repo_url: https://github.com/pgailinas/project0
edit_uri: edit/main/docs/

theme:
  name: material

  font:
    text: Merriweather Sans
    code: Red Hat Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - content.action.edit

  palette:
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: green
      accent: deep purple

    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: blue
      accent: deep orange

nav:
  - Welcome to Project0: index.md
  - Project Platform:
      - Project Charter: Project_Charter.md
      - Development Environment: Development_Environment.md
      - Document Standards: Documentation_Standards.md
      - Project Directory Structure: Project_Directory_Structure.md
      - Shared Data Models and Error Contracts: Shared_Data_Models_and_Error_Contracts.md
      - Implementation Roadmap: Implementation_Roadmap.md
      - Implementation Status: Implementation_Status.md
  - Documentation AI Agent:
      - Documentation AI Agent Functional Spec: Documentation_Agent_Functional_Spec.md
      - Documentation AI Agent Architecture: Documentation_Agent_Architecture.md
      - Documentation AI Agent Design: Documentation_Agent_Design.md


markdown_extensions:
  - attr_list
  - admonition

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  
