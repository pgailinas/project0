site_name: Project0
site_description: >-
  A documentation-first AI software development platform for building,
  validating, and maintaining AI-assisted software systems.

site_url: https://pgailinas.github.io/project0/

repo_name: pgailinas/project0
repo_url: https://github.com/pgailinas/project0
edit_uri: edit/main/docs/

theme:
  name: material

  font:
    text: Merriweather Sans
    code: Red Hat Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.action.edit

  palette:
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: green
      accent: deep purple

    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: blue
      accent: deep orange

nav:
  - Welcome to Project0: index.md

  - Project Documentation:
      - Overview: project/index.md
      - Project Charter: project/Project_Charter.md
      - Project Directory Structure: project/Project_Directory_Structure.md
      - Development Environment: project/Development_Environment.md
      - Development Standards: project/Development_Standards.md
      - Documentation Standards: project/Documentation_Standards.md
      - Testing Guide: project/Testing_Guide.md
      - Implementation Roadmap: project/Implementation_Roadmap.md
      - Implementation Status: project/Implementation_Status.md

  - Platform Documentation:
      - Overview: platform/index.md
      - Dashboard Design: platform/Dashboard_Design.md
      - Component Communication Design: platform/Component_Communication_Design.md
      - Shared Data Models and Error Contracts: platform/Shared_Data_Models_and_Error_Contracts.md
      - Agent Skills Design: platform/Agent_Skills_Design.md
      - Project0 Validation Status: platform/Project0_Validation_Status.md
      
  - Documentation Agent:
      - Overview: agents/documentation/index.md
      - Documentation Agent Charter: agents/documentation/Documentation_Agent_Charter.md
      - Documentation Agent Functional Spec: agents/documentation/Documentation_Agent_Functional_Spec.md
      - Documentation Agent Architecture: agents/documentation/Documentation_Agent_Architecture.md
      - Documentation Agent Design: agents/documentation/Documentation_Agent_Design.md
      - Documentation Agent Interface Design: agents/documentation/Documentation_Agent_Interface_Design.md
      - Documentation Agent Testing Guide: agents/documentation/Documentation_Agent_Testing_Guide.md
      - Documentation Agent Test Plan: agents/documentation/Documentation_Agent_Test_Plan.md
      - Documentation Agent Test Results: agents/documentation/Documentation_Agent_Test_Results.md

  - Research Agent:
      - Overview: agents/research/index.md
      - Research Agent Charter: agents/research/Research_Agent_Charter.md
      - Research Agent Functional Spec: agents/research/Research_Agent_Functional_Spec.md
      - Research Agent Architecture: agents/research/Research_Agent_Architecture.md
      - Research Agent Design: agents/research/Research_Agent_Design.md
      - Research Agent Interface Design: agents/research/Research_Agent_Interface_Design.md
      - Research Agent Testing Guide: agents/research/Research_Agent_Testing_Guide.md
      - Research Agent Test Plan: agents/research/Research_Agent_Test_Plan.md
      - Research Agent Test Results: agents/research/Research_Agent_Test_Results.md

markdown_extensions:
  - attr_list
  - admonition

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  
