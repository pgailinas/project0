site_name: Project0
site_description: >-
  A documentation-first AI software development platform for building,
  validating, and maintaining AI-assisted software systems.

site_url: https://pgailinas.github.io/project0/

repo_name: pgailinas/project0
repo_url: https://github.com/pgailinas/project0
edit_uri: edit/main/docs/

theme:
  name: material

  font:
    text: Merriweather Sans
    code: Red Hat Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - content.action.edit

  palette:
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
      primary: green
      accent: deep purple

    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: blue
      accent: deep orange

nav:
  - Welcome to Project0: index.md
  - Directory Structure: Project_Directory_Structure.md
  - Project:
      - Project Charter: 01_Project_Charter.md
      - Document Standards: 02_Doc_Standards.md
      - Implementation Roadmap: 06_Implementation_Roadmap.md
      - Implementation Status: 07_Implementation_Status.md
  - Document AI Agent:
      - Functional Spec: 03_Doc_Agent_Functional_Spec.md
      - Doc Agent Architecture: 04_Doc_Agent_Architecture.md
      - Doc Agent Design: 05_Doc_Agent_Design.md


markdown_extensions:
  - attr_list
  - admonition

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  
