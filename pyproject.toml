[project]
name = "project0"
version = "0.1.0"
description = "Documentation-first AI software development platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

authors = [
    {name = "Phil Gailinas"}
]

dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "pypdf",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

